<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;700{% if page.urdu %}&family=Noto+Nastaliq+Urdu:wght@400{% endif %}&display=swap">
<script>
  (function () {
    var root = document.documentElement, t = null, seen = null;
    try { t = localStorage.getItem('theme'); seen = localStorage.getItem('booted'); } catch (e) {}
    if (t !== 'light' && t !== 'night') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'night';
    }
    root.setAttribute('data-theme', t);
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!seen && !calm) { root.className += ' boot'; }
    try { localStorage.setItem('booted', '1'); } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ base_path }}/assets/css/world.css">
